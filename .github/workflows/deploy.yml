name: Deploy to Firebase

on:
  push:
    branches: [main]

permissions:
  contents: read

# Un solo despliegue a producción a la vez
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Crea el environment "production" en Settings → Environments y añade
    # revisores obligatorios para exigir aprobación antes de publicar.
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Hosting sirve la carpeta public/ tal cual (firebase.json); no hay paso
      # de build, así que ya no se instalan dependencias ni se exponen los
      # secretos VITE_* en este job. Reglas y Functions se despliegan aparte
      # (scripts/deploy-rules.mjs).
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c  # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
